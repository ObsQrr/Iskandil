[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
authors = ["Kayon"]

[workspace.dependencies]
iskandil-core = { path = "crates/core" }
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = "0.61"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
